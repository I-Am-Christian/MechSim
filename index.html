<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MECHSIM // Iron Frontier</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#e0e8eb;font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid #33434b;background:#161e27}h1,h2,h3{margin:0 0 12px}h1{font-size:24px;letter-spacing:5px}small,.muted{color:#92a5af}main{max-width:1250px;margin:auto;padding:24px}button,select{font:inherit;color:inherit;background:#26343e;border:1px solid #4b626c;padding:10px 14px;border-radius:5px;cursor:pointer}button:hover{background:#3a515b}button:disabled{opacity:.4;cursor:default}.primary{background:#b8d877;color:#152014;font-weight:800;border:0}section,.panel{background:#19232c;border:1px solid #35434c;padding:20px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.stat{margin:10px 0}progress{width:100%;accent-color:#b8d877;height:12px}label{display:block;margin:12px 0}select{width:100%;margin-top:5px}#arena{width:100%;height:auto;display:block;background:#121e24;touch-action:none}#combat{display:none;position:relative}#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px;background:#19232c}#log{min-height:35px;color:#b8d877}#preview{width:100%;height:250px;background:radial-gradient(ellipse,#34444c,#141b22)}.mission{margin:8px 0;padding:12px;border:1px solid #43535a;border-radius:5px}.mission.active{border-color:#b8d877}.touch button{min-width:48px;touch-action:none} @media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:10px}header{padding:12px}h1{font-size:18px}}
</style></head><body><header><div><h1>MECHSIM</h1><small>IRON FRONTIER / PILOT OPERATIONS</small></div><div id="wallet"></div></header><main><div id="hangar"><div class="row" style="justify-content:space-between;margin-bottom:18px"><div><h2>Forward operating base</h2><span class="muted">Build your machine. Choose your contract. Survive.</span></div><button id="reset">Reset career</button></div><div class="grid"><section><h3>01 / Mech assembly</h3><canvas id="preview" width="600" height="300"></canvas><div id="parts"></div><div id="stats"></div></section><section><h3>02 / Contract terminal</h3><div id="missions"></div><h3 style="margin-top:20px">03 / Deployment mode</h3><div class="row"><button class="primary" id="launch3">Deploy · 3D cockpit</button><button id="launch2">Deploy · 2D tactical</button></div><p class="muted">WASD move / Q,E rotate / mouse aim in 2D / click or Space fire / Shift dash / R repair (one charge) / Esc abort.</p><p id="log"></p></section></div></div><div id="combat"><div id="hud"><span id="objective"></span><span id="health"></span><span id="heat"></span><span id="ammo"></span><button id="abort">Abort</button></div><canvas id="arena" width="1000" height="620"></canvas><div class="row touch" style="padding:10px"><button data-key="q">↶</button><button data-key="w">↑</button><button data-key="e">↷</button><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button><button data-key=" ">FIRE</button><button data-key="shift">DASH</button><button data-key="r">REPAIR</button></div><p id="battlelog"></p></div></main><script>
'use strict';
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rand=(a,b)=>a+Math.random()*(b-a);
const catalog={chassis:[{n:'Scout / Wraith',cost:0,hp:95,speed:245,cap:12,color:'#a6cfca'},{n:'Assault / Titan',cost:350,hp:165,speed:165,cap:20,color:'#d7aa70'},{n:'Heavy / Bastion',cost:700,hp:245,speed:115,cap:28,color:'#a9a0df'}],weapon:[{n:'Autocannon',cost:0,damage:19,rate:.19,heat:8,weight:5,range:550},{n:'Pulse laser',cost:220,damage:32,rate:.35,heat:18,weight:7,range:700},{n:'Rail lance',cost:500,damage:90,rate:1.05,heat:35,weight:12,range:900},{n:'Scatter cannon',cost:300,damage:13,rate:.5,heat:20,weight:8,range:290,pellets:5}],armor:[{n:'Light plating',cost:0,hp:0,weight:1},{n:'Reactive armor',cost:200,hp:55,weight:5},{n:'Ceramic fortress',cost:450,hp:110,weight:9}],reactor:[{n:'Standard core',cost:0,cool:23,weight:1},{n:'Cryo core',cost:250,cool:39,weight:3},{n:'Fusion core',cost:550,cool:58,weight:5}]};
const contracts=[{n:'Dust patrol',desc:'Eliminate a raider squad.',count:6,reward:260,type:'hunt',need:0},{n:'Relay defense',desc:'Protect the relay for 45 seconds.',count:8,reward:420,type:'defend',need:1},{n:'Salvage run',desc:'Recover three supply cores and reach extraction.',count:9,reward:550,type:'salvage',need:2},{n:'Iron siege',desc:'Destroy the enemy commander and escort.',count:12,reward:900,type:'boss',need:3}];
const fresh=()=>({credits:300,wins:0,owned:{chassis:[0],weapon:[0],armor:[0],reactor:[0]},fit:{chassis:0,weapon:0,armor:0,reactor:0},paint:'#9dbb80'});let save;try{save=JSON.parse(localStorage.getItem('mechsim-v1'))||fresh()}catch{save=fresh()}let chosen=0;
function persist(){try{localStorage.setItem('mechsim-v1',JSON.stringify(save))}catch{}}
function build(){let c=catalog.chassis[save.fit.chassis],w=catalog.weapon[save.fit.weapon],a=catalog.armor[save.fit.armor],r=catalog.reactor[save.fit.reactor],mass=w.weight+a.weight+r.weight;return {hp:c.hp+a.hp,speed:c.speed*(1-.25*mass/c.cap),cap:c.cap,mass,w,cool:r.cool}}
function render(){ $('wallet').textContent='₡ '+save.credits+'  |  VICTORIES '+save.wins; $('parts').innerHTML=Object.entries(catalog).map(([k,v])=>'<label>'+k.toUpperCase()+'<select data-part="'+k+'">'+v.map((p,i)=>'<option value="'+i+'" '+(save.fit[k]===i?'selected':'')+'>'+p.n+(save.owned[k].includes(i)?' · owned':' · ₡'+p.cost)+'</option>').join('')+'</select></label>').join('')+'<label>Paint <input id="paint" type="color" value="'+save.paint+'"></label>';document.querySelectorAll('[data-part]').forEach(el=>el.onchange=()=>{let k=el.dataset.part,i=+el.value,p=catalog[k][i];if(!save.owned[k].includes(i)){if(save.credits<p.cost){$('log').textContent='Insufficient credits.';render();return}save.credits-=p.cost;save.owned[k].push(i)}save.fit[k]=i;persist();render()});$('paint').oninput=e=>{save.paint=e.target.value;persist();preview()};let b=build();$('stats').innerHTML='Armor: '+b.hp+' · Speed: '+Math.round(b.speed)+' · Cooling: '+b.cool+'/s<div class="stat">Load: '+b.mass+'/'+b.cap+'<progress max="'+b.cap+'" value="'+b.mass+'"></progress></div>'+(b.mass>b.cap?'OVERWEIGHT — change equipment.':'');$('missions').innerHTML=contracts.map((m,i)=>'<div class="mission '+(chosen===i?'active':'')+'"><strong>'+m.n+'</strong> · ₡'+m.reward+'<p>'+m.desc+'</p><button data-m="'+i+'" '+(save.wins<m.need?'disabled':'')+'>'+(save.wins<m.need?'Locked':chosen===i?'Selected':'Select')+'</button></div>').join('');document.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{chosen=+el.dataset.m;render()});$('launch2').disabled=$('launch3').disabled=b.mass>b.cap;preview()}
function preview(){let c=$('preview').getContext('2d');c.clearRect(0,0,600,300);c.save();c.translate(300,150);c.fillStyle='#0c141a';c.beginPath();c.ellipse(0,100,120,22,0,0,7);c.fill();let s=1+save.fit.chassis*.13;c.scale(s,s);c.fillStyle='#283842';c.fillRect(-53,20,40,80);c.fillRect(13,20,40,80);c.fillStyle=save.paint;c.fillRect(-65,-65,130,91);c.fillRect(-100,-58,30,83);c.fillRect(70,-58,30,83);c.fillStyle='#121a22';c.fillRect(-32,-85,64,38);c.fillStyle='#a4e8ed';c.fillRect(-22,-76,44,10);c.fillStyle='#667c87';c.fillRect(76,-18,18+save.fit.weapon*8,78);c.strokeStyle='#e0ebeb';c.strokeRect(-65,-65,130,91);c.restore()}
const canvas=$('arena'),ctx=canvas.getContext('2d'),keys=new Set();let g=null,raf=0,last=0,mouse={x:500,y:310,down:false,active:false};
function start(mode){let b=build();if(b.mass>b.cap)return;let m=contracts[chosen];g={mode,b,m,x:0,y:0,angle:0,hp:b.hp,heat:0,over:false,cd:0,repair:1,dash:0,t:0,relay:130,cores:0,enemies:[],bullets:[],loot:[],rocks:[],kills:0,spawn:0,hit:0};for(let i=0;i<m.count;i++)spawn(m.type==='boss'&&i===0);for(let i=0;i<32;i++)g.rocks.push({x:rand(-950,950),y:rand(-950,950),r:rand(15,42)});if(m.type==='salvage')for(let i=0;i<3;i++)g.loot.push({x:rand(-700,700),y:rand(-700,700)});$('hangar').style.display='none';$('combat').style.display='block';$('battlelog').textContent='Contract active.';keys.clear();mouse.down=false;mouse.active=false;last=performance.now();raf=requestAnimationFrame(frame)}
function spawn(boss=false){let a=rand(0,Math.PI*2),r=rand(420,820);g.enemies.push({x:clamp(g.x+Math.cos(a)*r,-950,950),y:clamp(g.y+Math.sin(a)*r,-950,950),hp:boss?450:65,max:boss?450:65,r:boss?35:20,cd:rand(.3,2),boss})}
function finish(win){if(!g)return;let reward=win?g.m.reward:0,msg=win?'Contract complete. Earned ₡'+reward+' · '+g.kills+' kills.':'Contract ended. No payout.';if(win){save.credits+=reward;save.wins++;persist()}g=null;cancelAnimationFrame(raf);keys.clear();mouse.down=false;$('combat').style.display='none';$('hangar').style.display='block';$('log').textContent=msg;render()}
function fire(){let w=g.b.w;if(g.cd>0||g.over)return;g.cd=w.rate;g.heat+=w.heat;if(g.heat>=100){g.heat=100;g.over=true}for(let i=0;i<(w.pellets||1);i++){let a=g.angle+(w.pellets?rand(-.24,.24):0);g.bullets.push({x:g.x,y:g.y,vx:Math.sin(a)*850,vy:-Math.cos(a)*850,life:w.range/850,d:w.damage,enemy:false})}}
function update(dt){let p=g;p.t+=dt;p.cd-=dt;p.dash-=dt;p.hit-=dt;p.heat=Math.max(0,p.heat-p.b.cool*dt);if(p.heat<35)p.over=false;if(keys.has('q'))p.angle-=2.2*dt;if(keys.has('e'))p.angle+=2.2*dt;if(p.mode===2&&mouse.active){p.angle=Math.atan2(mouse.x-500,-(mouse.y-310))}let f=Number(keys.has('w'))-Number(keys.has('s')),s=Number(keys.has('d'))-Number(keys.has('a')),norm=Math.hypot(f,s)||1,boost=1;if(keys.has('shift')&&p.dash<=0&&(f||s)){p.dash=2;boost=8}let a=p.mode===3?p.angle:0;p.x=clamp(p.x+(Math.sin(a)*f+Math.cos(a)*s)/norm*p.b.speed*dt*boost,-1000,1000);p.y=clamp(p.y+(-Math.cos(a)*f+Math.sin(a)*s)/norm*p.b.speed*dt*boost,-1000,1000);if(keys.has('r')&&p.repair&&p.hp<p.b.hp){p.hp=Math.min(p.b.hp,p.hp+65);p.repair=0}if(keys.has(' ')||mouse.down)fire();for(let e of p.enemies){let target=p.m.type==='defend'&&Math.hypot(e.x-p.x,e.y-p.y)>230?{x:0,y:0}:p,dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy)||1;if(d>120){e.x+=dx/d*(e.boss?48:82)*dt;e.y+=dy/d*(e.boss?48:82)*dt}e.cd-=dt;if(e.cd<=0&&d<480){e.cd=e.boss?.7:1.65;p.bullets.push({x:e.x,y:e.y,vx:dx/d*280,vy:dy/d*280,life:1.8,d:e.boss?18:8,enemy:true,target:target===p?'pilot':'relay'})}}for(let b of p.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.enemy){if(Math.hypot(b.x-p.x,b.y-p.y)<21){p.hp-=b.d;p.hit=.15;b.life=0}else if(p.m.type==='defend'&&Math.hypot(b.x,b.y)<27){p.relay-=b.d;b.life=0}}else for(let e of p.enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp-=b.d;b.life=0;break}}}p.bullets=p.bullets.filter(b=>b.life>0);p.enemies=p.enemies.filter(e=>{if(e.hp<=0){p.kills++;return false}return true});if(p.m.type==='defend'&&p.t<40){p.spawn+=dt;if(p.spawn>6){p.spawn=0;spawn()}}p.loot=p.loot.filter(l=>{if(Math.hypot(l.x-p.x,l.y-p.y)<55){p.cores++;return false}return true});if(p.hp<=0||p.relay<=0)return finish(false);if((['hunt','boss'].includes(p.m.type)&&!p.enemies.length)||(p.m.type==='defend'&&p.t>=45)||(p.m.type==='salvage'&&p.cores===3&&Math.hypot(p.x,p.y)<65))return finish(true)}
function mech2(x,y,a,color,r=20){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#172129';ctx.fillRect(-r,-r*.7,r*.45,r*1.7);ctx.fillRect(r*.55,-r*.7,r*.45,r*1.7);ctx.fillStyle=color;ctx.fillRect(-r*.7,-r*.8,r*1.4,r*1.5);ctx.fillRect(r*.65,-r*.9,r*.35,r*1.4);ctx.fillStyle='#a9e9ef';ctx.fillRect(-r*.35,-r*.65,r*.7,r*.2);ctx.fillStyle='#778990';ctx.fillRect(r*.65,-r*1.6,r*.25,r);ctx.restore()}
function draw2(){let p=g;ctx.fillStyle='#1f3035';ctx.fillRect(0,0,1000,620);ctx.strokeStyle='#31444a';for(let x=(-p.x+500)%60;x<1000;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,620);ctx.stroke()}for(let y=(-p.y+310)%60;y<620;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}let X=x=>x-p.x+500,Y=y=>y-p.y+310;for(let r of p.rocks){ctx.fillStyle='#425056';ctx.beginPath();ctx.arc(X(r.x),Y(r.y),r.r,0,7);ctx.fill()}if(['defend','salvage'].includes(p.m.type)){ctx.strokeStyle='#83e2b5';ctx.lineWidth=3;ctx.strokeRect(X(0)-40,Y(0)-40,80,80)}for(let l of p.loot){ctx.fillStyle='#e5d17e';ctx.fillRect(X(l.x)-9,Y(l.y)-9,18,18)}for(let e of p.enemies){let x=X(e.x),y=Y(e.y);mech2(x,y,Math.atan2(p.x-e.x,-(p.y-e.y)),'#ba675c',e.r);ctx.fillStyle='#ef9a81';ctx.fillRect(x-20,y-30,40*e.hp/e.max,4)}for(let b of p.bullets){ctx.fillStyle=b.enemy?'#ff8b62':'#e5ffab';ctx.fillRect(X(b.x)-3,Y(b.y)-3,6,6)}mech2(500,310,p.angle,save.paint,23)}
function project(x,y,h=0){let p=g,dx=x-p.x,dy=y-p.y,z=dx*Math.sin(p.angle)-dy*Math.cos(p.angle),side=dx*Math.cos(p.angle)+dy*Math.sin(p.angle);if(z<12)return null;let scale=520/z;return {x:500+side*scale,y:300+(65-h)*scale,s:scale,z}}
function draw3(){let p=g,sky=ctx.createLinearGradient(0,0,0,300);sky.addColorStop(0,'#18242e');sky.addColorStop(1,'#788d91');ctx.fillStyle=sky;ctx.fillRect(0,0,1000,300);ctx.fillStyle='#35454a';ctx.fillRect(0,300,1000,320);ctx.strokeStyle='#52656a';for(let i=-1400;i<=1400;i+=100){let prev=null;for(let j=-1400;j<=1400;j+=100){let v=project(i,j);if(v&&prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(v.x,v.y);ctx.stroke()}prev=v}prev=null;for(let j=-1400;j<=1400;j+=100){let v=project(j,i);if(v&&prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(v.x,v.y);ctx.stroke()}prev=v}}let objects=[...p.rocks.map(o=>({...o,kind:'rock'})),...p.enemies.map(o=>({...o,kind:'enemy'})),...p.loot.map(o=>({...o,kind:'loot',r:12})),...(['defend','salvage'].includes(p.m.type)?[{x:0,y:0,r:35,kind:'relay'}]:[])].map(o=>({...o,v:project(o.x,o.y)})).filter(o=>o.v).sort((a,b)=>b.v.z-a.v.z);for(let o of objects){let {x,y,s}=o.v,w=o.r*s,h=w*(o.kind==='enemy'?3:1.7);if(x<-w||x>1000+w)continue;ctx.fillStyle=o.kind==='enemy'?'#a74f47':o.kind==='loot'?'#e9d076':o.kind==='relay'?'#75d6b2':'#4d5a5e';if(o.kind==='enemy'){ctx.fillRect(x-w*.8,y-h,w*1.6,h*.65);ctx.fillRect(x-w*.65,y-h*.35,w*.5,h*.35);ctx.fillRect(x+w*.15,y-h*.35,w*.5,h*.35);ctx.fillStyle='#ffd3a1';ctx.fillRect(x-w*.4,y-h*.9,w*.8,h*.1);ctx.fillStyle='#f0a58c';ctx.fillRect(x-w,y-h-8,w*2*o.hp/o.max,4)}else{ctx.fillRect(x-w,y-h,w*2,h);ctx.fillStyle='#829293';ctx.beginPath();ctx.moveTo(x-w,y-h);ctx.lineTo(x-w*.5,y-h-w*.35);ctx.lineTo(x+w*1.4,y-h-w*.35);ctx.lineTo(x+w,y-h);ctx.fill()}}for(let b of p.bullets){let v=project(b.x,b.y,35);if(v){ctx.fillStyle=b.enemy?'#ff9165':'#dcff9a';ctx.fillRect(v.x-3,v.y-3,6,6)}}ctx.fillStyle='#18232c';ctx.beginPath();ctx.moveTo(0,620);ctx.lineTo(0,480);ctx.lineTo(220,535);ctx.lineTo(390,620);ctx.fill();ctx.beginPath();ctx.moveTo(1000,620);ctx.lineTo(1000,480);ctx.lineTo(780,535);ctx.lineTo(610,620);ctx.fill();ctx.fillStyle='#50616a';ctx.fillRect(740,495,85,125);ctx.fillStyle='#27343b';ctx.fillRect(755,470,55,110);ctx.strokeStyle='#b8d877';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(480,300);ctx.lineTo(520,300);ctx.moveTo(500,280);ctx.lineTo(500,320);ctx.stroke();ctx.fillStyle='#b8d877';ctx.font='14px monospace';ctx.fillText('HEADING '+Math.round((p.angle*180/Math.PI%360+360)%360)+'°',420,35);if(p.cd>p.b.w.rate*.7){ctx.fillStyle='#f4d886';ctx.beginPath();ctx.arc(782,465,18,0,7);ctx.fill()}}
function radar(){let p=g;ctx.fillStyle='#101b21cc';ctx.fillRect(845,15,140,140);ctx.strokeStyle='#76928c';ctx.strokeRect(845,15,140,140);for(let e of p.enemies){let dx=e.x-p.x,dy=e.y-p.y;if(p.mode===3){let a=p.angle;[dx,dy]=[dx*Math.cos(a)+dy*Math.sin(a),-dx*Math.sin(a)+dy*Math.cos(a)]}ctx.fillStyle='#f1816f';ctx.fillRect(915+clamp(dx/14,-65,65),85+clamp(dy/14,-65,65),4,4)}ctx.fillStyle='#b8d877';ctx.fillRect(912,82,6,6)}
function frame(now){if(!g)return;let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);if(!g)return;g.mode===2?draw2():draw3();radar();if(g.hit>0){ctx.strokeStyle='#ff634d';ctx.lineWidth=12;ctx.strokeRect(0,0,1000,620)}$('objective').textContent=g.m.type==='defend'?'Relay '+Math.ceil(g.relay)+' / '+Math.max(0,Math.ceil(45-g.t))+'s':g.m.type==='salvage'?'Cores '+g.cores+'/3 · return to origin':'Hostiles '+g.enemies.length;$('health').textContent='Hull '+Math.ceil(g.hp)+'/'+g.b.hp;$('heat').textContent='Heat '+Math.ceil(g.heat)+'%'+(g.over?' OVERHEAT':'');$('ammo').textContent='Repair '+g.repair+' | Dash '+Math.max(0,g.dash).toFixed(1)+'s';raf=requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(!g)return;let k=e.key.toLowerCase();if(['w','a','s','d','q','e',' ','shift','r','escape'].includes(k))e.preventDefault();if(k==='escape')finish(false);else keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();mouse.down=false});canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*1000/r.width;mouse.y=(e.clientY-r.top)*620/r.height;mouse.active=true;if(g&&g.mode===3&&mouse.down)g.angle+=e.movementX*.003});canvas.addEventListener('pointerdown',e=>{mouse.down=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>mouse.down=false);canvas.addEventListener('pointercancel',()=>mouse.down=false);document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.key)});$('launch2').onclick=()=>start(2);$('launch3').onclick=()=>start(3);$('abort').onclick=()=>finish(false);$('reset').onclick=()=>{if(confirm('Erase career progress?')){save=fresh();chosen=0;persist();render()}};render();
</script></body></html>
